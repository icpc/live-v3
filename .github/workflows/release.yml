name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Name of release (without 'v')
        required: true
      publish:
        type: boolean
        description: Would release be published
        required: true
        default: true
      draft:
        type: boolean
        description: Publish draft first
        required: true
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-instance

jobs:
  build:
    name: Create artifacts from master
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and its tag
      packages: write # push the image to ghcr.io
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Shared Setup Steps
        uses: ./.github/workflows/setup
        with:
          setup-gradle: 'true'
          setup-node: 'true'

      - name: Build with gradle
        run: ./gradlew release --scan -Pnpm.download=false -Pbuild_version=${{ inputs.version }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts
          path: artifacts

      - name: Create release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --target "${{ github.sha }}" \
            --title "v${{ inputs.version }}" \
            --generate-notes \
            ${{ inputs.draft && '--draft' || '' }} \
            artifacts/*

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest is moved by promote-latest.yml when the release is published,
          # so that a draft or a test run never takes it over.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=schedule,pattern={{date 'YYYYMMDD'}}
            
      - name: Copy live.zip into cloud overlayer
        run: cp artifacts/live-v3-*.zip ./src/cloud-instance-docker/live.zip

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        env:
          # Don't export a build record artifact and a job summary for every release build.
          DOCKER_BUILD_SUMMARY: false
        with:
          context: ./src/cloud-instance-docker/
          build-args: USER_ARCHIVE=live.zip
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

