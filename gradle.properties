kotlin.code.style=official

build_version=dev

#change this to `false` to use system-installed npm
npm.download=true

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Dkotlin.daemon.jvm.options=-Xmx1500m,Xms500m
org.gradle.isolated-projects=true
org.gradle.tooling.parallel=true

# Without this, dokka defaults to V2EnabledWithHelpers and registers the dead
# `dokkaHtml`/`dokkaJavadoc`/`dokkaGfm`/`dokkaJekyll` v1-migration helper tasks.
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled

live.dev.embedFrontend=true
live.dev.credsFile=creds.json
live.dev.analyticsTemplatesFile=analytics-en.json