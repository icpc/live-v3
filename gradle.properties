kotlin.code.style=official

build_version=dev

#change this to `false` to use system-installed npm
npm.download=true

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Dkotlin.daemon.jvm.options=-Xmx1500m,Xms500m
org.gradle.unsafe.isolated-projects=true

# this is workaround for dokka looking for properies in project-isolation incompatible way
# if it's not set.
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.nowarn=true
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true
org.jetbrains.dokka.experimental.tryK2=true
org.jetbrains.dokka.experimental.tryK2.nowarn=true
org.jetbrains.dokka.experimental.tryK2.noWarn=true
org.jetbrains.dokka.internal.enableWorkaroundKT80551=true

live.dev.embedFrontend=true